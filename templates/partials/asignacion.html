{% load report_tags %}
<div id="bloque-asignacion">
  <h3 class="font-semibold text-sm mb-3" style="color:#0f172a;">Asignación de Tester</h3>
  {% if reporte.asignado_a %}
  <div class="flex items-center gap-2 mb-3 px-3 py-2 rounded-lg" style="background:#d1fae5;border:1px solid #6ee7b7;">
    <span class="w-2 h-2 rounded-full flex-shrink-0" style="background:#059669;"></span>
    <span class="text-sm font-medium" style="color:#065f46;">
      {{ reporte.asignado_a.get_full_name|default:reporte.asignado_a.email }}
    </span>
  </div>
  {% else %}
  <p class="text-xs mb-3" style="color:#94a3b8;">Sin tester asignado</p>
  {% endif %}
  <form hx-post="/admin/reportes/{{ reporte.pk }}/asignar/"
        hx-target="#bloque-asignacion"
        hx-swap="outerHTML"
        class="flex flex-col gap-2">
    {% csrf_token %}
    <select name="asignado_a" class="w-full px-3 py-2.5 rounded-lg text-sm outline-none"
            style="border:1.5px solid #e2e8f0;background:#f8fafc;color:#374151;">
      <option value="">— Sin asignar</option>
      {% for t in testers %}
        <option value="{{ t.pk }}" {% if reporte.asignado_a == t %}selected{% endif %}>
          {{ t.get_full_name|default:t.email }}
        </option>
      {% endfor %}
    </select>
    <button type="submit"
            class="w-full py-2 rounded-lg text-xs font-semibold text-white"
            style="background:#2563eb;"
            onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
      Asignar tester
    </button>
  </form>
</div>
