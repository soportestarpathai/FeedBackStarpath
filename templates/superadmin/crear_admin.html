{% extends 'base.html' %}
{% block title %}Crear Admin — FeedbackEve{% endblock %}
{% block nav_sa_admins %}active{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-6 py-6">
  <a href="/superadmin/admins/" class="inline-flex items-center gap-1 text-sm mb-5" style="color:#64748b;">← Volver</a>
  <h1 class="text-xl font-bold mb-6" style="color:#0f172a;">Crear Administrador</h1>

  <form method="post" class="bg-white rounded-xl p-6" style="border:1px solid #e2e8f0;">
    {% csrf_token %}
    <div class="flex flex-col gap-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color:#374151;">Nombre</label>
          <input type="text" name="first_name" placeholder="Juan"
                 class="w-full px-3 py-2.5 rounded-lg text-sm outline-none"
                 style="border:1.5px solid #e2e8f0;background:#f8fafc;color:#0f172a;"
                 onfocus="this.style.borderColor='#7c3aed'" onblur="this.style.borderColor='#e2e8f0'">
        </div>
        <div>
          <label class="block text-xs font-medium mb-1.5" style="color:#374151;">Apellido</label>
          <input type="text" name="last_name" placeholder="Administrador"
                 class="w-full px-3 py-2.5 rounded-lg text-sm outline-none"
                 style="border:1.5px solid #e2e8f0;background:#f8fafc;color:#0f172a;"
                 onfocus="this.style.borderColor='#7c3aed'" onblur="this.style.borderColor='#e2e8f0'">
        </div>
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5" style="color:#374151;">Correo electrónico *</label>
        <input type="email" name="email" required placeholder="admin@empresa.com"
               class="w-full px-3 py-2.5 rounded-lg text-sm outline-none"
               style="border:1.5px solid #e2e8f0;background:#f8fafc;color:#0f172a;"
               onfocus="this.style.borderColor='#7c3aed'" onblur="this.style.borderColor='#e2e8f0'">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5" style="color:#374151;">Contraseña *</label>
        <input type="password" name="password" required placeholder="Mínimo 8 caracteres"
               class="w-full px-3 py-2.5 rounded-lg text-sm outline-none"
               style="border:1.5px solid #e2e8f0;background:#f8fafc;color:#0f172a;"
               onfocus="this.style.borderColor='#7c3aed'" onblur="this.style.borderColor='#e2e8f0'">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1.5" style="color:#374151;">Plataformas asignadas</label>
        <div class="flex flex-col gap-2">
          {% for p in plataformas %}
          <label class="flex items-center gap-2 text-sm cursor-pointer" style="color:#374151;">
            <input type="checkbox" name="plataformas" value="{{ p.pk }}"> {{ p.nombre }}
          </label>
          {% endfor %}
        </div>
      </div>
      <button type="submit"
              class="w-full py-3 rounded-lg text-sm font-semibold text-white mt-2"
              style="background:#7c3aed;"
              onmouseover="this.style.background='#6d28d9'" onmouseout="this.style.background='#7c3aed'">
        Crear Administrador
      </button>
    </div>
  </form>
</div>
{% endblock %}
